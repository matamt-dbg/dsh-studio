<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="DSH Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6bff"/>
      <stop offset="1" stop-color="#2a3fd1"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Three tuning tracks: a preset is a set of adjusted settings. -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.38">
    <line x1="30" y1="40" x2="98" y2="40"/>
    <line x1="30" y1="64" x2="98" y2="64"/>
    <line x1="30" y1="88" x2="98" y2="88"/>
  </g>
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <line x1="30" y1="40" x2="72" y2="40"/>
    <line x1="30" y1="64" x2="50" y2="64"/>
    <line x1="30" y1="88" x2="86" y2="88"/>
  </g>
  <g fill="#ffffff">
    <circle cx="72" cy="40" r="10"/>
    <circle cx="50" cy="64" r="10"/>
    <circle cx="86" cy="88" r="10"/>
  </g>
  <g fill="#2a3fd1">
    <circle cx="72" cy="40" r="4"/>
    <circle cx="50" cy="64" r="4"/>
    <circle cx="86" cy="88" r="4"/>
  </g>
</svg>
